[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DUSE_ETHERNET_W5500=0
  -DDISABLE_ARDUINO_WIFI_BYPASS=1
lib_deps =
  WiFi
  WebServer
  WebServerSecure
  WiFiUDP
  WiFiClientSecure
  Preferences
  SPI
# If using W5500 Ethernet shield: set -DUSE_ETHERNET_W5500=1 and add:
#   Ethernet
; Single firmware, role selected at runtime via Portal (no re-flash).
; Flash:  pio run -t upload
; Monitor: pio run -t monitor
