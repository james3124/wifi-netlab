[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
src_dir = src
build_flags =
  -DUSE_ETHERNET_W5500=0
lib_deps =
  WiFi
  WebServer
  WebServerSecure
  WiFiUDP
  WiFiClientSecure
  Preferences
  SPI
; Flash: pio run -t upload  (one ESP32 at a time, same firmware all nodes)
; Then set role per node in portal http://<node-ip>/config
